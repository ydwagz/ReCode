{% extends 'base.html' %}

{% block content %}
<section class="hero">
    <div class="hero-content">
        <div class="leaderboard-container">
            <h2>Leaderboard</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Place</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                     {% for player in players %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ player.name }}</td>
                        <td>{{ player.score }}</td>
                        
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>

{% endblock %}
